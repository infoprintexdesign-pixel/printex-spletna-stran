# Ob vsaki spremembi na veji main obvesti drugega urejevalca.
# Spremembe od zanresni / Claude -> obvestilo za @infoprintexdesign-pixel (mail).
# Spremembe od Printex Design ne sprožijo maila; zanresni jih dobi kot obvestilo od Clauda.
# Obvestilo pride kot komentar na commit z omembo, zato GitHub pošlje mail in obvestilo v aplikaciji.
name: Obvestilo o spremembi

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  obvesti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const commits = context.payload.commits || [];
            if (!commits.length) return;
            const head = context.payload.head_commit || commits[commits.length - 1];
            const fromColleague =
              context.actor === 'infoprintexdesign-pixel' ||
              (head.author && head.author.email === 'info.printexdesign@gmail.com');
            if (fromColleague) return;
            const komu = '@infoprintexdesign-pixel';
            const kdo = 'zanresni';
            const seznam = commits.map(c => `- ${c.message.split('\n')[0]}`).join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: head.id,
              body: `${komu} – nova sprememba na spletni strani (${kdo}):\n\n${seznam}\n\nStran: https://printexdesign.netlify.app`,
            });
